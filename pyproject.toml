[project]
name = "pyAS4"
version = "9"
description = "Your package description"
authors = [{ name="Andrey Shapovalov" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.1",
    "zeep>=4.3.3",
    "pymtom_xop @ git+https://github.com/AndreyShapovalovVN/pymtom-xop.git",
