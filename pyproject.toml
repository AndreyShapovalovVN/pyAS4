[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pyAS4"
version = "0.1.25"
description = "Python бібліотека для роботи з AS4 (OASIS ebXML AS4) протоколом обміну повідомленнями"
authors = [{ name = "Andriy Shapovalov" }]
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
keywords = ["as4", "ebms", "ebxml", "OOTS", "edelivery", "domibus", "soap", "mtom", "xop"]
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.1",
    "zeep>=4.3.3",
    "pymtom-xop-fork>=0.0.3",
]

[project.urls]
Homepage = "https://github.com/AndreyShapovalovVN/pyAS4"
Issues = "https://github.com/AndreyShapovalovVN/pyAS4/issues"
Source = "https://github.com/AndreyShapovalovVN/pyAS4"
Documentation = "https://github.com/AndreyShapovalovVN/pyAS4#readme"

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["pyAS4*", "pyAS4.*"]

[tool.setuptools.package-data]
pyAS4 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.mypy]
exclude = ["^build/"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["lxml.*", "pymtom_xop.*"]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["N999"]
